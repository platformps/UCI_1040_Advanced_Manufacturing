<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLAB 634.1.1: Zero-Energy Isolation Walkthrough</title>
    <style>
        :root {
            --ps-blue: #004b87;
            --ps-orange: #f26f29;
            --ps-dark: #1e293b;
            --ps-light: #f8fafc;
            --ps-gray: #64748b;
            --ps-success: #16a34a;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #cbd5e1;
            color: var(--ps-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .walkthrough-card {
            background: #ffffff;
            width: 850px;
            max-width: 100%;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--ps-blue);
            color: #ffffff;
            padding: 24px 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 0.9rem;
            color: #93c5fd;
            margin-top: 4px;
        }

        .progress-container {
            width: 100%;
            background-color: #e2e8f0;
            height: 8px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--ps-orange);
            width: 20%;
            transition: width 0.4s ease-in-out;
        }

        .slide-body {
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 480px;
        }

        .visual-container {
            width: 100%;
            max-width: 650px;
            height: 230px;
            background-color: var(--ps-light);
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            padding: 12px;
        }

        .visual-container svg {
            width: 100%;
            height: 100%;
        }

        .slide-title {
            font-size: 1.35rem;
            color: var(--ps-blue);
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
        }

        .slide-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--ps-dark);
            text-align: center;
            max-width: 700px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 32px;
            background-color: #f1f5f9;
            border-top: 1px solid #e2e8f0;
        }

        .step-indicator {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ps-gray);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-prev {
            background-color: #94a3b8;
            color: #ffffff;
        }

        .btn-prev:hover:not(:disabled) {
            background-color: #64748b;
        }

        .btn-next {
            background-color: var(--ps-orange);
            color: #ffffff;
        }

        .btn-next:hover:not(:disabled) {
            background-color: #d95e20;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="walkthrough-card">
        <div class="header">
            <h1>GLAB 634.1.1: Zero-Energy Isolation Walkthrough</h1>
            <p>High-Level Technical Walkthrough Presentation</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="slide-body">
            <div class="visual-container" id="visual-container"></div>
            <div class="slide-title" id="slide-title">Phase Title</div>
            <div class="slide-text" id="slide-text">Phase description goes here.</div>
        </div>

        <div class="navigation">
            <div class="step-indicator" id="step-indicator">Phase 1 of 5</div>
            <div class="btn-group">
                <button class="btn-prev" id="btn-prev" onclick="changeSlide(-1)">Previous</button>
                <button class="btn-next" id="btn-next" onclick="changeSlide(1)">Next</button>
            </div>
        </div>
    </div>

    <script>
        const walkthroughData = [
            {

                    <rect x="40" y="30" width="230" height="140" rx="10" fill="#004b87" opacity="0.1" stroke="#004b87" stroke-width="2" stroke-dasharray="6 4"/>
                    <text x="155" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#004b87" text-anchor="middle">Zone 2: VR Simulation Grid</text>
                    <path d="M 90 90 C 90 75, 220 75, 220 90 C 220 125, 190 125, 155 125 C 120 125, 90 125, 90 90 Z" fill="#004b87"/>

                    <rect x="100" y="80" width="110" height="8" rx="4" fill="#f26f29"/>

                    <path d="M 300 100 L 340 100" stroke="#f26f29" stroke-width="4" marker-end="url(#arrow)"/>
                    <rect x="360" y="30" width="200" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
                    <text x="460" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#004b87" text-anchor="middle">Safety Briefing Checklist</text>
                    <circle cx="385" cy="85" r="8" fill="#16a34a"/>
                    <text x="402" y="89" font-family="sans-serif" font-size="12" fill="#333333">NFPA 70E Boundaries</text>
                    <circle cx="385" cy="115" r="8" fill="#16a34a"/>
                    <text x="402" y="119" font-family="sans-serif" font-size="12" fill="#333333">Shock & Arc Flash Hazards</text>
                    <circle cx="385" cy="145" r="8" fill="#16a34a"/>
                    <text x="402" y="149" font-family="sans-serif" font-size="12" fill="#333333">Virtual DMM Verification</text>
                </svg>`
            },
            {
                title: "Phase 2: Schematic Tracing & Energy Source Identification",
                text: "Analyze the electrical one-line diagram for the motor control station at your learner desk. Trace incoming power from main disconnect switch DISC-1 down to motor contactors, control transformers, and VFD DC bus terminals to identify all primary and stored energy domains.",
                svg: `<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
                    <rect width="600" height="200" fill="#f8fafc" rx="8"/>
                    <text x="300" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#004b87" text-anchor="middle">System One-Line Diagram & Energy Matrix</text>
                    <line x1="80" y1="70" x2="520" y2="70" stroke="#004b87" stroke-width="3"/>
                    <text x="75" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#004b87">480V AC Main</text>
                    <rect x="120" y="95" width="100" height="60" rx="6" fill="#ffffff" stroke="#f26f29" stroke-width="2"/>
                    <text x="170" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">DISC-1</text>
                    <text x="170" y="140" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Primary Main</text>
                    <line x1="170" y1="70" x2="170" y2="95" stroke="#004b87" stroke-width="2"/>
                    <rect x="250" y="95" width="100" height="60" rx="6" fill="#ffffff" stroke="#004b87" stroke-width="2"/>
                    <text x="300" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">CB-101</text>
                    <text x="300" y="140" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Control Power</text>
                    <line x1="300" y1="70" x2="300" y2="95" stroke="#004b87" stroke-width="2"/>
                    <rect x="380" y="95" width="100" height="60" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
                    <text x="430" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">VFD Bus</text>
                    <text x="430" y="140" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Stored DC Cap</text>
                    <line x1="430" y1="70" x2="430" y2="95" stroke="#004b87" stroke-width="2"/>
                    <circle cx="170" cy="175" r="10" fill="#f26f29"/>

                    <circle cx="300" cy="175" r="10" fill="#004b87"/>
                    <text x="300" y="179" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
                    <circle cx="430" cy="175" r="10" fill="#16a34a"/>
                    <text x="430" y="179" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
                </svg>`
            },
            {
                title: "Phase 3: PPE Donning & Physical LOTO Hardware Application",
                text: "Inspect and don Class 0 electrical safety gloves with leather protectors and ANSI safety glasses outside the Zone 4 Arc Flash Boundary. Move disconnect DISC-1 to OFF, attach a steel scissor hasp, secure your personal red padlock, attach a completed Danger Tag, and perform a physical tug-test.",
                svg: `<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
                    <rect width="600" height="200" fill="#f8fafc" rx="8"/>
                    <rect x="50" y="40" width="110" height="120" rx="8" fill="#e2e8f0" stroke="#004b87" stroke-width="2"/>
                    <text x="105" y="65" font-family="sans-serif" font-size="12" font-weight="bold" fill="#004b87" text-anchor="middle">DISC-1 Switch</text>
                    <rect x="95" y="85" width="20" height="50" rx="3" fill="#dc2626"/>
                    <text x="105" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">OFF</text>
                    <path d="M 180 100 L 210 100" stroke="#f26f29" stroke-width="3"/>
                    <rect x="220" y="60" width="80" height="80" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
                    <circle cx="260" cy="85" r="15" fill="none" stroke="#dc2626" stroke-width="4"/>
                    <path d="M 250 110 L 270 110 L 270 130 L 250 130 Z" fill="#64748b"/>
                    <text x="260" y="155" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Steel Hasp</text>
                    <path d="M 320 100 L 350 100" stroke="#f26f29" stroke-width="3"/>
                    <rect x="360" y="80" width="60" height="60" rx="6" fill="#dc2626"/>
                    <path d="M 375 80 L 375 60 C 375 50, 405 50, 405 60 L 405 80" fill="none" stroke="#94a3b8" stroke-width="5"/>
                    <text x="390" y="115" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">LOCK</text>
                    <text x="390" y="155" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Red Padlock</text>
                    <path d="M 440 100 L 470 100" stroke="#f26f29" stroke-width="3"/>
                    <polygon points="480,50 540,50 550,60 550,150 480,150" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
                    <rect x="490" y="65" width="50" height="20" fill="#ffffff"/>
                    <text x="515" y="79" font-family="sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">DANGER</text>
                    <text x="515" y="105" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">WO-2026-01</text>
                    <text x="515" y="155" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Danger Tag</text>
                </svg>`
            },
            {
                title: "Phase 4: Three-Step Live-Dead-Live Voltage Verification",
                text: "Execute a mandatory Live-Dead-Live test using a Fluke 117 Digital Multimeter. Verify the meter on a known live 120V AC outlet (Phase A), verify 0.0V AC Line-to-Line and Line-to-Ground on DISC-1 load terminals (Phase B), and re-verify meter function on the live outlet (Phase C).",
                svg: `<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
                    <rect width="600" height="200" fill="#f8fafc" rx="8"/>
                    <rect x="230" y="30" width="140" height="140" rx="10" fill="#004b87"/>
                    <rect x="250" y="45" width="100" height="35" rx="4" fill="#bbf7d0"/>
                    <text x="300" y="68" font-family="monospace" font-size="18" font-weight="bold" fill="#166534" text-anchor="middle">0.0 V AC</text>
                    <circle cx="300" cy="115" r="20" fill="#1e293b" stroke="#f26f29" stroke-width="3"/>
                    <text x="300" y="160" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Fluke 117 DMM</text>
                    <rect x="40" y="55" width="130" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
                    <text x="105" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">Phase A: Live Check</text>
                    <text x="105" y="105" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">120V Aux Outlet</text>
                    <text x="105" y="125" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">PASS (120V AC)</text>
                    <path d="M 170 100 L 220 100" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 2"/>
                    <rect x="430" y="55" width="130" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
                    <text x="495" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">Phase C: Post Check</text>
                    <text x="495" y="105" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Re-test Aux Outlet</text>
                    <text x="495" y="125" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">PASS (120V AC)</text>
                    <path d="M 380 100 L 430 100" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 2"/>
                    <text x="300" y="188" font-family="sans-serif" font-size="11" font-weight="bold" fill="#004b87" text-anchor="middle">Phase B: Dead Check on Isolated Circuit (DISC-1 Load Terminals)</text>
                </svg>`
            },
            {
                title: "Phase 5: Stored Energy Dissipation & Zero-Energy Sign-Off",
                text: "Measure VFD DC bus terminals to confirm stored capacitance has bled below 5.0V DC. Perform a mechanical rotation check of the motor shaft while wearing cut-resistant gloves, conduct a physical try-step press of the START button, and complete the GDP verification sign-off.",
                svg: `<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
                    <rect width="600" height="200" fill="#f8fafc" rx="8"/>
                    <rect x="40" y="45" width="150" height="110" rx="8" fill="#ffffff" stroke="#004b87" stroke-width="2"/>
                    <text x="115" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#004b87" text-anchor="middle">VFD Bus Bleed</text>
                    <text x="115" y="100" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">&lt; 5.0V DC</text>
                    <text x="115" y="130" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Capacitance Dissipated</text>
                    <rect x="225" y="45" width="150" height="110" rx="8" fill="#ffffff" stroke="#004b87" stroke-width="2"/>
                    <text x="300" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#004b87" text-anchor="middle">Mechanical & Try-Step</text>
                    <circle cx="270" cy="110" r="16" fill="#e2e8f0" stroke="#333333" stroke-width="2"/>
                    <text x="270" y="114" font-family="sans-serif" font-size="9" text-anchor="middle">Shaft</text>
                    <circle cx="330" cy="110" r="16" fill="#dc2626"/>
                    <text x="330" y="114" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">START</text>
                    <text x="300" y="142" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Zero Rotation / No Start</text>
                    <rect x="410" y="45" width="150" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
                    <text x="485" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">GDP Sign-Off</text>
                    <path d="M 440 95 L 460 115 L 520 80" stroke="#16a34a" stroke-width="4" fill="none"/>
                    <text x="485" y="135" font-family="sans-serif" font-size="10" font-weight="bold" fill="#004b87" text-anchor="middle">Verified Zero-Energy</text>
                </svg>`
            }
        ];

        let currentSlide = 0;

        function updateUI() {
            const slide = walkthroughData[currentSlide];
            
            document.getElementById('slide-title').innerText = slide.title;
            document.getElementById('slide-text').innerText = slide.text;
            document.getElementById('visual-container').innerHTML = slide.svg;
            document.getElementById('step-indicator').innerText = `Phase ${currentSlide + 1} of ${walkthroughData.length}`;

            const progressPercentage = ((currentSlide + 1) / walkthroughData.length) * 100;
            document.getElementById('progress-bar').style.width = progressPercentage + '%';

            document.getElementById('btn-prev').disabled = currentSlide === 0;
            
            const btnNext = document.getElementById('btn-next');
            if (currentSlide === walkthroughData.length - 1) {
                btnNext.innerText = "Finish";
            } else {
                btnNext.innerText = "Next";
            }
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= walkthroughData.length) currentSlide = walkthroughData.length - 1;
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
