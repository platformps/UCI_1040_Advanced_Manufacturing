<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLAB 635.3.1 Mechanical Joining Methods & P&ID Tracing Walkthrough</title>
    <style>
        :root {
            --ps-blue: #005587;
            --ps-orange: #F26D21;
            --ps-dark: #1E293B;
            --ps-light: #F8FAFC;
            --ps-card: #FFFFFF;
            --ps-border: #E2E8F0;
            --text-muted: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--ps-light);
            color: var(--ps-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #app-container {
            background-color: var(--ps-card);
            width: 100%;
            max-width: 820px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--ps-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--ps-blue);
            color: #ffffff;
            padding: 24px;
            text-align: center;
            border-bottom: 4px solid var(--ps-orange);
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.88rem;
            opacity: 0.9;
        }

        .progress-container {
            width: 100%;
            background-color: #E2E8F0;
            height: 8px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--ps-orange);
            width: 20%;
            transition: width 0.4s ease;
        }

        .content-area {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 420px;
        }

        .phase-badge {
            background-color: #E0F2FE;
            color: var(--ps-blue);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 12px;
            border: 1px solid #BAE6FD;
        }

        .phase-title {
            color: var(--ps-blue);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 18px;
            text-align: center;
        }

        .schematic-box {
            width: 100%;
            min-height: 210px;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            border-radius: 10px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-bottom: 22px;
            color: #38BDF8;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .schematic-title {
            color: #F8FAFC;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .schematic-caption {
            color: #94A3B8;
            font-size: 0.82rem;
            margin-top: 4px;
        }

        .phase-text {
            font-size: 0.98rem;
            line-height: 1.65;
            color: #334155;
            width: 100%;
            text-align: left;
        }

        .phase-text p {
            margin-bottom: 10px;
        }

        .phase-text ul {
            padding-left: 20px;
        }

        .phase-text li {
            margin-bottom: 8px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background-color: #F8FAFC;
            border-top: 1px solid var(--ps-border);
        }

        .btn {
            background-color: var(--ps-blue);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 0.92rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            background-color: #003D63;
        }

        .btn:disabled {
            background-color: #CBD5E1;
            cursor: not-allowed;
            color: #94A3B8;
        }

        .step-count {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="header">
            <h1>GLAB 635.3.1 Fast-MTTR Pipe Joining & P&ID Tracing</h1>
            <p>Student Pre-Lab High-Level Walkthrough</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="content-area">
            <span class="phase-badge" id="phase-badge">Phase 1 of 5</span>
            <h2 class="phase-title" id="phase-title">Loading...</h2>
            
            <div class="schematic-box" id="schematic-container">
            </div>

            <div class="phase-text" id="phase-text">
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="btn-prev" onclick="changePhase(-1)" disabled>Previous</button>
            <span class="step-count" id="step-count">1 / 5</span>
            <button class="btn" id="btn-next" onclick="changePhase(1)">Next</button>
        </div>
    </div>

    <script>
        const phases = new Array();
        phases.push({
            badge: "Phase 1 of 5",
            title: "Pre-Lab VR Onboarding & Zero-Energy LOTO Isolation",
            svgGraphic: '<svg width="180" height="90" viewBox="0 0 180 90" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="20" width="60" height="50" rx="8" stroke="#38BDF8" stroke-width="2" fill="#1E293B"/><circle cx="45" cy="45" r="14" stroke="#F26D21" stroke-width="2.5" fill="none"/><line x1="45" y1="31" x2="45" y2="59" stroke="#F26D21" stroke-width="2.5"/><rect x="105" y="20" width="60" height="50" rx="8" stroke="#38BDF8" stroke-width="2" fill="#1E293B"/><path d="M125 45 L135 55 L150 35" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
            schematicTitle: "System Schematic 1: VR Grid & LOTO Isolation Verification",
            schematicCaption: "Interplay PLMB113 VR Grid & Fluke 117 Live-Dead-Live Electrical Verification",
            text: "<p>Learners execute digital onboarding and safety compliance prior to fast-MTTR spool assembly:</p><ul><li><strong>Zone 2 VR Grid Simulation:</strong> Access Meta Quest 3 headsets in Zone 2 to launch Interplay PLMB113, practicing virtual grooved coupling positioning and gasket alignment.</li><li><strong>Zero-Energy LOTO & LDL Test:</strong> Apply physical padlocks to the Fluid Tabletop Trainer disconnect in Zone 3 and perform a 3-step Live-Dead-Live check using a Fluke 117 DMM per NFPA 70E.</li></ul>"
        });
        phases.push({
            badge: "Phase 2 of 5",
            title: "Gamified P&ID Bug Hunt Time Attack",
            svgGraphic: '<svg width="180" height="90" viewBox="0 0 180 90" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="15" width="140" height="60" rx="6" stroke="#38BDF8" stroke-width="2" fill="#1E293B"/><circle cx="50" cy="45" r="15" stroke="#EF4444" stroke-width="2" fill="none"/><line x1="40" y1="45" x2="60" y2="45" stroke="#EF4444" stroke-width="2"/><circle cx="90" cy="45" r="15" stroke="#4ADE80" stroke-width="2" fill="none"/><polyline points="83,45 88,52 98,40" stroke="#4ADE80" stroke-width="2" fill="none"/><circle cx="130" cy="45" r="15" stroke="#38BDF8" stroke-width="2" fill="none"/><text x="130" y="49" fill="#38BDF8" font-size="12" font-family="sans-serif" text-anchor="middle" font-weight="bold">i</text></svg>',
            schematicTitle: "System Schematic 2: P&ID Redline GDP Color-Coding",
            schematicCaption: "Red = Additions, Green = Deletions, Blue = Notes for Hardware Auditing",
            text: "<p>Learners transition to Zone 3 with fine-tip redlining pens for a 25-minute gamified Time Attack:</p><ul><li><strong>Hardware Discrepancy Detection:</strong> Locate 3 engineered errors injected into trainer piping (Victaulic coupling vs NPT, reversed check valve CV-102, and mislabeled PT-101 wire tag).</li><li><strong>GDP Drawing Redlining:</strong> Redline paper P&ID drawing package ICT-101_P Sheet 2 using mandatory GDP color codes (Red for additions, Green for deletions, Blue for notes).</li></ul>"
        });
        phases.push({
            badge: "Phase 3 of 5",
            title: "Fast-MTTR Victaulic Coupling & Union Assembly",
            svgGraphic: '<svg width="180" height="90" viewBox="0 0 180 90" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="35" width="120" height="20" rx="4" stroke="#38BDF8" stroke-width="2" fill="#1E293B"/><rect x="75" y="25" width="30" height="40" rx="6" stroke="#F26D21" stroke-width="2.5" fill="#1E293B"/><line x1="90" y1="10" x2="90" y2="25" stroke="#F26D21" stroke-width="2"/><text x="90" y="82" fill="#F8FAFC" font-size="9" font-family="sans-serif" text-anchor="middle" font-weight="bold">tau = 30.0 ft-lbs (F = 30.0 lbs)</text></svg>',
            schematicTitle: "System Schematic 3: Mechanical Fast-MTTR Spool Coupling",
            schematicCaption: "1-Inch Victaulic Grooved Coupling with Silicone-Lubricated EPDM Gasket",
            text: "<p>Learners assemble and torque fast-MTTR spool components on the Fluid Tabletop Trainer skid:</p><ul><li><strong>Gasket Lubrication:</strong> Apply approved silicone lubricant to EPDM synthetic gasket lips (never wrap grooved gaskets in Teflon tape).</li><li><strong>Single-Variable Torque Calculation:</strong> Calculate required manual force F = tau / d = 30.0 ft-lbs / 1.0 ft = 30.0 lbs of perpendicular handle force.</li><li><strong>Alternating Star Torquing:</strong> Tighten Grade 8 track bolts using a calibrated click torque wrench to 30.0 ft-lbs until bolt pads achieve metal-to-pad contact.</li></ul>"
        });
        phases.push({
            badge: "Phase 4 of 5",
            title: "Hydrostatic Pressure Hold Test & Zero-Leak Verification",
            svgGraphic: '<svg width="180" height="90" viewBox="0 0 180 90" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="90" cy="45" r="32" stroke="#4ADE80" stroke-width="3" fill="#1E293B"/><path d="M90 20 L90 45 L110 45" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round"/><text x="90" y="65" fill="#4ADE80" font-size="10" font-family="sans-serif" text-anchor="middle" font-weight="bold">100.0 PSI (Delta P = 0)</text></svg>',
            schematicTitle: "System Schematic 4: 10-Minute Hydrostatic Pressure Hold",
            schematicCaption: "Manual Test Pump Pressurization & Fluke Gauge Pressure Hold",
            text: "<p>Learners verify joint integrity and zero leakage under Good Manufacturing Practices (GMP):</p><ul><li><strong>Spool Air Bleeding:</strong> Fill spool assembly with water and vent air through bleed valve BV-101 until a solid fluid stream emerges.</li><li><strong>System Pressurization:</strong> Stroke manual hydrostatic pump until system pressure reaches 100.0 PSI on the Fluke digital pressure gauge.</li><li><strong>10-Minute Hold Test:</strong> Monitor pressure for 10 minutes, verifying Delta P = 0.0 PSI drop and zero moisture weeping across all Victaulic gasket pads and union faces.</li></ul>"
        });
        phases.push({
            badge: "Phase 5 of 5",
            title: "AI Maintenance Log Audit & Peer Quality Sign-Off",
            svgGraphic: '<svg width="180" height="90" viewBox="0 0 180 90" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="15" width="120" height="60" rx="6" stroke="#4ADE80" stroke-width="2" fill="#1E293B"/><path d="M45 45 L55 55 L75 35" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="85" y1="38" x2="135" y2="38" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/><line x1="85" y1="52" x2="135" y2="52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/><text x="110" y="65" fill="#94A3B8" font-size="8" font-family="sans-serif" text-anchor="middle">GDP Verification</text></svg>',
            schematicTitle: "System Schematic 5: AI Audit Override & Peer Quality Sign-Off",
            schematicCaption: "Detection of 3 AI Violations & Mandatory Human Verification Log Entry",
            text: "<p>The lab closes with AI output auditing, dual signature sign-off, and classroom cleanup:</p><ul><li><strong>AI Draft Audit:</strong> Detect three critical AI report errors (Teflon tape on EPDM gaskets, skipping hydrostatic test, and hammering union nuts) and write a corrected GDP log entry.</li><li><strong>Quality Verification Sign-Off:</strong> Obtain primary technician and peer inspector signatures, zero torque wrench springs, clear 3-4 ft service aisles, and upload work to Canvas LMS.</li></ul>"
        });

        let currentIndex = 0;

        function updateUI() {
            const current = phases.at(currentIndex);
            document.getElementById('phase-badge').textContent = current.badge;
            document.getElementById('phase-title').textContent = current.title;
            document.getElementById('phase-text').innerHTML = current.text;
            
            const schematicContainer = document.getElementById('schematic-container');
            schematicContainer.innerHTML = current.svgGraphic +
                '<div class="schematic-title">' + current.schematicTitle + '</div>' +
                '<div class="schematic-caption">' + current.schematicCaption + '</div>';

            const progress = ((currentIndex + 1) / phases.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('step-count').textContent = (currentIndex + 1) + ' / ' + phases.length;

            document.getElementById('btn-prev').disabled = currentIndex === 0;
            
            const btnNext = document.getElementById('btn-next');
            if (currentIndex === phases.length - 1) {
                btnNext.textContent = "Finish";
                btnNext.disabled = true;
            } else {
                btnNext.textContent = "Next";
                btnNext.disabled = false;
            }
        }

        function changePhase(step) {
            currentIndex += step;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= phases.length) currentIndex = phases.length - 1;
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
