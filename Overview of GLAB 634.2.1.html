<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLAB/IPLAB 634.2.1: P&IDs, Schematics, and Blueprint Bug Hunt Walkthrough</title>
    <style>
        :root {
            --ps-blue: #004b87;
            --ps-orange: #f26f29;
            --ps-dark: #1e293b;
            --ps-light: #f8fafc;
            --ps-gray: #64748b;
            --ps-success: #16a34a;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #cbd5e1;
            color: var(--ps-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .walkthrough-card {
            background: #ffffff;
            width: 850px;
            max-width: 100%;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--ps-blue);
            color: #ffffff;
            padding: 24px 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 0.9rem;
            color: #93c5fd;
            margin-top: 4px;
        }

        .progress-container {
            width: 100%;
            background-color: #e2e8f0;
            height: 8px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--ps-orange);
            width: 20%;
            transition: width 0.4s ease-in-out;
        }

        .slide-body {
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 480px;
        }

        .visual-container {
            width: 100%;
            max-width: 650px;
            height: 230px;
            background-color: var(--ps-light);
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            padding: 12px;
        }

        .visual-container svg {
            width: 100%;
            height: 100%;
        }

        .slide-title {
            font-size: 1.35rem;
            color: var(--ps-blue);
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
        }

        .slide-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--ps-dark);
            text-align: center;
            max-width: 700px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 32px;
            background-color: #f1f5f9;
            border-top: 1px solid #e2e8f0;
        }

        .step-indicator {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ps-gray);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-prev {
            background-color: #94a3b8;
            color: #ffffff;
        }

        .btn-prev:hover:not(:disabled) {
            background-color: #64748b;
        }

        .btn-next {
            background-color: var(--ps-orange);
            color: #ffffff;
        }

        .btn-next:hover:not(:disabled) {
            background-color: #d95e20;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="walkthrough-card">
        <div class="header">
            <h1>GLAB/IPLAB 634.2.1: P&IDs, Schematics, and Blueprint Bug Hunt</h1>

        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="slide-body">
            <div class="visual-container" id="visual-container"></div>
            <div class="slide-title" id="slide-title">Phase Title</div>
            <div class="slide-text" id="slide-text">Phase description goes here.</div>
        </div>

        <div class="navigation">
            <div class="step-indicator" id="step-indicator">Phase 1 of 5</div>
            <div class="btn-group">
                <button class="btn-prev" id="btn-prev" onclick="changeSlide(-1)">Previous</button>
                <button class="btn-next" id="btn-next" onclick="changeSlide(1)">Next</button>
            </div>
        </div>
    </div>

                    <rect x="405" y="40" width="160" height="28" rx="8" fill="#dc2626"/>
                    <text x="485" y="58" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Bug 2: Pneumatic</text>

                    <text x="300" y="182" font-family="sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">I:0/4 Photoeye Inverted to NC</text>
                </svg>`
            },
            {
                title: "Phase 4: AI Log Audit & Human Physical Verification",
                text: "Audit the AI-generated maintenance log for Work Order WO-2026-PID-02. Identify critical errors where the AI missed physical hardware discrepancies and falsely recommended energizing 480V power without PPE or control checks. Author a corrected, GDP-compliant technician log with dual signatures.",

            }
        ];

        let currentSlide = 0;

        function updateUI() {
            const slide = walkthroughData[currentSlide];
            
            document.getElementById('slide-title').innerText = slide.title;
            document.getElementById('slide-text').innerText = slide.text;
            document.getElementById('visual-container').innerHTML = slide.svg;
            document.getElementById('step-indicator').innerText = `Phase ${currentSlide + 1} of ${walkthroughData.length}`;

            const progressPercentage = ((currentSlide + 1) / walkthroughData.length) * 100;
            document.getElementById('progress-bar').style.width = progressPercentage + '%';

            document.getElementById('btn-prev').disabled = currentSlide === 0;
            
            const btnNext = document.getElementById('btn-next');
            if (currentSlide === walkthroughData.length - 1) {
                btnNext.innerText = "Finish";
            } else {
                btnNext.innerText = "Next";
            }
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= walkthroughData.length) currentSlide = walkthroughData.length - 1;
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
